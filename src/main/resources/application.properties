# Server Port
server.port=${PORT:8080}

# Application Name
spring.application.name=college-event-registration

# Database Configuration (Chosen Database: H2 Embedded Database)
# Persists to local file ./data/eventdb so data remains saved across server restarts
spring.datasource.url=jdbc:h2:file:./data/eventdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

